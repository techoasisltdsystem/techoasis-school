# Included inside the school site's HTTPS server block by deploy/setup-app.sh.
# Sends /api/ to the school server (listens only on this machine) and keeps the server's source code off the web.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 14m;            # teaching applications can carry a few small documents
    proxy_read_timeout 60s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    include /var/www/techoasis-school/deploy/nginx/security-headers.conf;
}
location ^~ /server/ { return 404; }
